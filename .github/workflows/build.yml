name: Build Custom Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # Removed container for simplicity/stability
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Prepare Container Environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common gnupg sudo git tzdata ca-certificates \
            binutils make bc bison openssl curl zip kmod cpio flex libelf-dev libssl-dev libtfm-dev libc6-dev \
            device-tree-compiler python3 xz-utils aria2 build-essential ccache pigz parallel jq opam libpcre3-dev \
            clang lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf gcc-arm-linux-gnueabihf \
            python3.10

          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          update-alternatives --install /usr/bin/python python /usr/bin/python3.10 1

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          arch: arm64
          android-version: 14
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          config: gki_defconfig
          ksu: true
          nethunter: true
          nethunter-patch: false
          parallel: 4
