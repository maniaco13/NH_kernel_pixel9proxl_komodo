name: Build Custom Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          arch: arm64
          android-version: 14
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          config: gki_defconfig
          ksu: true
          nethunter: true
          nethunter-patch: false
