name: Build Custom Kernel

on:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set Up Cache Key (ccache)
        id: cache
        run: |
          echo "cache-key=setup-cache-${{ runner.os }}-ccache-kernel" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        id: restore-ccache
        with:
          path: ~/.ccache
          key: ${{ steps.cache.outputs.cache-key }}
          # Use a fixed cache if key misses (e.g. for PRs)
          restore-keys: |
            setup-cache-${{ runner.os }}-ccache-kernel

      - name: Update & Install Build Dependencies
        run: |
          # Update package list
          sudo apt-get update

          # Install required packages (native on ubuntu-22.04)
          sudo apt-get install -y --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev \
            libpcre3-dev libc6-dev libtfm-dev \
            python3 python3.10 python3-pip \
            make binutils \
            device-tree-compiler cpio kmod xz-utils zip \
            clang lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            ccache pigz parallel jq aria2 tzdata curl ca-certificates gnupg

          # Ensure python3 points to python3.10
          sudo update-alternatives \
            --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives \
            --install /usr/bin/python python /usr/bin/python3.10 1

          # Confirm ccache is in PATH and working
          export PATH="/usr/lib/ccache:$PATH"
          echo "ccache in PATH: $(which ccache)"
          ccache --show-stats || true

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          arch: arm64
          android-version: 14
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          config: gki_defconfig
          ksu: true
          nethunter: true
          nethunter-patch: false
          parallel: 4
          # Ensure kernel build uses ccache
          ccache: true

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts-android14-gki
          path: |
            out/
            !out/.gitignore
          retention-days: 7
          if-no-files-found: error

      - name: Print Build Stats (Optional)
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          ccache --show-stats || true
