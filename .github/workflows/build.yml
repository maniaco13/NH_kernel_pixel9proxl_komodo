name: Build Custom Kernel - ManiacDragon

on:
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Set Custom Kernel Version Name
        run: |
          echo "-ManiacDragon" > localversion-maniac

      - name: Enable RTL-SDR and Advanced Pentesting Configs
        run: |
          CONFIG_PATH=$(find . -name "*defconfig" | head -n 1)
          if [ -f "$CONFIG_PATH" ]; then
            echo "Injecting flags into $CONFIG_PATH"
            echo "CONFIG_DVB_CORE=y" >> "$CONFIG_PATH"
            echo "CONFIG_DVB_USB=y" >> "$CONFIG_PATH"
            echo "CONFIG_DVB_USB_RTL28XXU=y" >> "$CONFIG_PATH"
            echo "CONFIG_USB_NET_CDCETHER=y" >> "$CONFIG_PATH"
            echo "CONFIG_CFG80211_INTERNAL_REG_RULE=y" >> "$CONFIG_PATH"
          fi

      - name: Set Up Cache Key (ccache)
        id: cache
        run: |
          echo "cache-key=setup-cache-${{ runner.os }}-ccache-kernel" >> $GITHUB_OUTPUT

      - name: Cache ccache
        uses: actions/cache@v4
        id: restore-ccache
        with:
          path: ~/.ccache
          key: ${{ steps.cache.outputs.cache-key }}
          restore-keys: |
            setup-cache-${{ runner.os }}-ccache-kernel

      - name: Update & Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential bc bison flex libssl-dev libelf-dev \
            libpcre3-dev libc6-dev libtfm-dev \
            python3 python3.10 python3-pip \
            make binutils \
            device-tree-compiler cpio kmod xz-utils zip \
            clang lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            ccache pigz parallel jq aria2 tzdata curl ca-certificates gnupg \
            pahole

          sudo update-alternatives \
            --install /usr/bin/python3 python3 /usr/bin/python3.10 1
          sudo update-alternatives \
            --install /usr/bin/python python /usr/bin/python3.10 1

          export PATH="/usr/lib/ccache:$PATH"
          ccache --show-stats || true

      - name: Build Kernel
        id: kernel_build
        uses: dabao1955/kernel_build_action@main
        continue-on-error: true
        with:
          arch: arm64
          android-version: 14
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          config: gki_defconfig
          ksu: true
          nethunter: true
          nethunter-patch: true
          ccache: true
          anykernel3: true

      - name: Package Complete Recovery-Ready Zip with ManiacDragon Name
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master ak3
          rm -rf ak3/.git ak3/anykernel.sh ak3/LICENSE
          find . -maxdepth 3 -name "Image.gz" -exec cp {} ak3/ \;
          find . -maxdepth 3 -name "anykernel.sh" -exec cp {} ak3/ \;
          
          sed -i 's/kernel.string=.*/kernel.string=ManiacDragon-PixelKernel/g' ak3/anykernel.sh
          
          cd ak3
          zip -r9 ../ManiacDragon-Kernel-Flashable.zip *
          cd ..

      - name: Upload Flashable Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManiacDragon-Flashable-Kernel
          path: ManiacDragon-Kernel-Flashable.zip

      - name: Fail explicitly if build failed
        if: steps.kernel_build.outcome == 'failure'
        run: exit 1

  self-heal-patch:
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout Source for Patching
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Gemini SDK
        run: pip install google-generativeai

      - name: Fetch Failed Build Logs via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view ${{ github.run_id }} --log-failed > build_error.log || echo "Failed to fetch logs via CLI" > build_error.log
          echo "--- Log Preview ---"
          tail -n 50 build_error.log || true

      - name: Run AI Agent Fixer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/workflows/scripts/ai_fixer.py

      - name: Create Pull Request with AI Fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="ai-fix-kernel-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "ci: auto-fix kernel compilation error using Gemini AI"
          git push origin "$BRANCH_NAME"
          
          gh pr create \
            --title "🤖 Self-Healed Fix: Kernel Compilation Error" \
            --body "Automated pull request generated by Gemini AI after analyzing the failed workflow run logs." \
            --base main \
            --head "$BRANCH_NAME"
