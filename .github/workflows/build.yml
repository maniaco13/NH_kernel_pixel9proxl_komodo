name: Build Custom Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare Container Environment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git tzdata python3.9 ca-certificates
          dpkg-divert --divert /usr/bin/python3.original --rename /usr/bin/python3
          ln -sf /usr/bin/python3.9 /usr/bin/python3

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          arch: arm64
          android-version: 14
          kernel-url: 'https://android.googlesource.com/kernel/common'
          kernel-branch: 'android14-6.1'
          config: gki_defconfig
          ksu: true
          nethunter: true
          nethunter-patch: false
